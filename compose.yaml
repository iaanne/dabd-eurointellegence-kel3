services:
  garage:
    image: docker.io/dxflrs/garage:v2.5.0
    container_name: eurogrid-garage
    command: ["/garage", "server", "--single-node"]
    restart: unless-stopped
    ports:
      - "3900:3900"
      - "3903:3903"
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro,Z
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  garage-webui:
    image: docker.io/khairul169/garage-webui:1.1.0
    container_name: eurogrid-garage-webui
    restart: unless-stopped
    depends_on:
      - garage
    ports:
      - "127.0.0.1:3909:3909"
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro,Z
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
      S3_REGION: "garage"

  prefect-server:
    image: docker.io/prefecthq/prefect:3-python3.12
    container_name: eurogrid-prefect-server
    restart: unless-stopped
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    ports:
      - "4200:4200"
    volumes:
      - prefect-data:/home/prefect/.prefect
    environment:
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  prefect-worker:
    build:
      context: .
      dockerfile: infra/prefect/Dockerfile
    image: localhost/eurogrid-prefect-worker:latest
    container_name: eurogrid-prefect-worker
    restart: unless-stopped
    depends_on:
      - prefect-server
    env_file:
      - .env
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      EUROGRID_DATA_DIR: /data
    volumes:
      - ./data:/data:Z
      - ./flows:/app/flows:ro,Z
      - ./src:/app/src:ro,Z
      - ./prefect.yaml:/app/prefect.yaml:ro,Z

  iceberg-rest:
    image: docker.io/apache/iceberg-rest-fixture:1.10.1
    container_name: eurogrid-iceberg-rest
    restart: unless-stopped
    depends_on:
      - garage
    ports:
      - "8181:8181"
    environment:
      CATALOG_CATALOG_NAME: eurogrid
      CATALOG_WAREHOUSE: s3://eurogrid-warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://garage:3900
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_S3_REGION: garage
      CATALOG_S3_ACCESS__KEY__ID: ${GARAGE_S3_ACCESS_KEY}
      CATALOG_S3_SECRET__ACCESS__KEY: ${GARAGE_S3_SECRET_KEY}
      AWS_REGION: garage
      AWS_DEFAULT_REGION: garage
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required

volumes:
  garage-meta:
  garage-data:
  prefect-data:
