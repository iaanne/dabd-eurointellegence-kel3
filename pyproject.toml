[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eurogrid"
version = "0.1.0"
description = "EuroGrid Intelligence, platform data kelistrikan Eropa untuk proyek TBP."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "pandas>=2.2",
  "pyarrow>=16",
  "python-dotenv>=1.0",
  "tenacity>=9",
]

[project.optional-dependencies]
iceberg = [
  "pyiceberg>=0.9",
]
prefect = [
  "prefect>=3",
]
dev = [
  "pytest>=8",
  "respx>=0.21",
]

[project.scripts]
eurogrid = "eurogrid.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eurogrid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "python-pptx>=1.0.2",
    "pyyaml>=6",
]
